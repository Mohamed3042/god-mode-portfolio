    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px; background: #08090d; color: #f5f7ff; font: 14px/1.4 system-ui, sans-serif; }
      header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }

      h2 { margin: 0 0 14px; font-size: 17px; letter-spacing: .08em; text-transform: uppercase; }
      .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
      figure { margin: 0; min-width: 0; }
      .frame { height: 280px; display: grid; place-items: center; overflow: hidden; border: 1px solid #303440; border-radius: 12px; background: #050609; }
      img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: top center; }
      figcaption { margin-top: 8px; color: #b7bdcb; font-size: 12px; text-align: center; }
    </style>
